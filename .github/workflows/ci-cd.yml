name: CI/CD - Mar de Fondo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    name: Pruebas de calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Tailwind de MICHOKS
        run: npm run build:css

      - name: Instalar navegador de pruebas
        run: npx playwright install chromium

      - name: Validar HTML5
        run: npm run test:html

      - name: Ejecutar pruebas WCAG, responsive y enlaces
        run: npm run test:e2e -- --reporter=line

  deploy:
    name: Publicar en GitHub Pages
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio estático
        run: |
          mkdir dist
          cp index.html online.html offline.html michoks.html tareas.html styles.css a11y.css offline-assets.css michoks.css michoks-a11y.css michoks-brand.css michoks-product-images.css michoks-tailwind.css tareas.css script.js michoks.js tareas.js README.md AUDITORIA.md dist/
          mkdir -p dist/assets
          cp -R assets/. dist/assets/
          mkdir -p dist/vendor
          cp vendor/bootstrap.min.css vendor/tailwind.css dist/vendor/

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
